<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Management Lab · Exercise 1 — Planning a Project</title>
<style>
  :root {
    --page: #f5f5f2; --surface: #fcfcfb; --ink: #16212b; --navy: #33475b;
    --secondary: #52514e; --muted: #898781; --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --red: #a5202f; --green: #2e7d32; --amber: #b5850b; --gold: #d99a06;
    --blue: #2a78d6; --orange: #eb6834; --aqua: #1baf7a; --violet: #7c5cd6;
    --b1: #2a78d6; --b2: #2e7d32; --b3: #d9691f; --b4: #7c5cd6;
    --b1t: #e8f1fc; --b2t: #e9f4e9; --b3t: #fdf0e6; --b4t: #f0ebfb;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 14px; --shadow: 0 2px 10px rgba(30,40,50,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--page); color: var(--ink); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 10px; gap: 14px; flex-wrap: wrap; }
  .header h1 { margin: 0; font-size: 21px; font-weight: 800; color: var(--navy); }
  .ver { font-size: 11px; color: var(--muted); font-weight: 700; }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .hdr-right .small { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12px; font-weight: 600; background: #fff; color: var(--ink); }
  .hdr-right .lnk { background: none; border: none; font-size: 12px; font-weight: 700; color: var(--muted); cursor: pointer; padding: 4px 6px; font-family: var(--sans); }
  .hdr-right .lnk:hover { color: var(--navy); text-decoration: underline; }
  .score { font-size: 13px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prog { width: 180px; height: 8px; background: #e8eae5; border-radius: 5px; overflow: hidden; }
  .progrow { display: flex; align-items: center; gap: 10px; margin: 0 0 8px 2px; }
  .progrow .prog { flex: 1; width: auto; }
  .prog > div { height: 100%; background: var(--green); border-radius: 5px; transition: width .5s; }
  .app { display: grid; grid-template-columns: 380px minmax(0,1fr) 250px; gap: 14px; padding: 0 16px 20px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .card h2 { margin: 0 0 8px; font-size: 12.5px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .07em; }
  .lp-step { font-size: 13.5px; line-height: 1.65; color: var(--ink); }
  .lp-step p { margin: 8px 0; }
  .lp-step b { color: var(--navy); }
  .lp-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; cursor: pointer; font-family: var(--sans); }
  .lp-opt:hover { border-color: var(--navy); }
  .lp-opt.ok { border-color: var(--green); background: #f2f8f2; box-shadow: inset 0 0 0 1.4px var(--green); }
  .lp-opt.bad { border-color: var(--red); background: #fdf1f1; }
  .lp-fb { font-size: 12.5px; line-height: 1.55; margin-top: 8px; padding: 9px 12px; border-radius: 10px; display: none; }
  .lp-fb.ok { display: block; background: #f2f8f2; color: #1d5a20; border: 1px solid rgba(46,125,50,.3); }
  .lp-fb.bad { display: block; background: #fdf1f1; color: var(--red); border: 1px solid rgba(165,32,47,.3); animation: shake .35s ease; }
  .lp-fb.info { display: block; background: #eff3f8; color: var(--navy); border: 1px solid rgba(51,71,91,.25); }
  .lp-status { font-size: 12.5px; color: var(--secondary); margin-top: 8px; font-variant-numeric: tabular-nums; line-height: 1.5; }
  .lp-status.pass { color: var(--green); font-weight: 800; }
  .lp-status.warn { color: var(--red); font-weight: 700; }
  .lp-nav { display: flex; gap: 8px; margin-top: 14px; }
  .lp-nav button { flex: 1; }
  button { appearance: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer; background: #eef0ee; color: var(--ink); }
  button:hover { filter: brightness(.97); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .primary:disabled { background: #b9c0c7; border-color: #b9c0c7; opacity: 1; }
  .mini { font-size: 12.5px; padding: 6px 11px; border-radius: 8px; background: #fff; font-weight: 700; color: var(--navy); }
  .lp-num { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .lp-num input { flex: 1 1 90px; min-width: 0; width: 90px; border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; font-size: 14px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  .lp-num.two { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .lp-num.two .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lp-num.two .fl { font-size: 11.5px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .lp-num.two input { width: 100%; min-width: 0; flex: 0 0 auto; padding: 7px 10px; }   /* a column flexbox: the flex-basis of the one-field rule would become a height */
  .lp-num input.off { border-color: var(--red); background: #fdf1f1; }
  .lp-num .asklbl { align-self: center; color: var(--navy); font-size: 13px; white-space: nowrap; }
  .hintrow { display: flex; gap: 6px; margin-top: 6px; }
  .hintrow .mini { font-size: 11.5px; padding: 4px 9px; }
  .pulse-btn, #arrangeBtn.pulse, #fwdBtn.pulse, #bwdBtn.pulse, #ganttBtn.pulse, .stagebtn.pulse { animation: btnpulse 1.15s ease-in-out infinite; border-color: var(--green) !important; color: var(--green) !important; }
  @keyframes btnpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(46,125,50,.55); } 55% { box-shadow: 0 0 0 7px rgba(46,125,50,0); } }
  @keyframes btnpulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(165,32,47,.6); } 55% { box-shadow: 0 0 0 7px rgba(165,32,47,0); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  @keyframes born { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes flashIn { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
  .flashIn { animation: flashIn .65s ease 5; }
  .coreidea { border: 1.5px solid rgba(181,133,11,.5); background: #fbf5e3; border-radius: 10px; padding: 9px 12px; margin: 9px 0 6px; font-size: 12.5px; line-height: 1.55; }
  .coreidea .ct { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--amber); margin-bottom: 3px; }
  .coreidea.dp { border-color: rgba(165,32,47,.45); background: #fdf3f3; }
  .coreidea.dp .ct { color: var(--red); }
  .clientbox { background: #eef3fa; border: 1px solid #c9d8ea; border-left: 4px solid var(--blue); border-radius: 10px; padding: 4px 13px; margin: 6px 0 10px; font-size: 13px; line-height: 1.6; }
  .clientbox p { margin: 8px 0; }
  .clientbox ul.dlist { margin: 2px 0 8px 20px; padding: 0; }
  .clientbox ul.dlist li { margin: 2px 0; }
  .clientbox .yj { font-weight: 800; color: var(--navy); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; margin: 12px 0 2px; }
  .valuebox { background: #fdf6e0; border: 1px solid #e5d391; border-left: 4px solid #8a6d1f; border-radius: 10px; padding: 10px 13px; margin: 10px 0; font-size: 12.5px; line-height: 1.55; }
  .valuebox .vt { font-weight: 800; color: #8a6d1f; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .valuebox .src { font-size: 10.5px; color: #9a8a52; margin-top: 5px; }
  .mbox .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .mbox .hd .mini { font-size: 11px; padding: 3px 8px; flex: none; }
  .bxBody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
  .bxBody > div { overflow: hidden; min-height: 0; }
  .mbox.min .bxBody { grid-template-rows: 0fr; }
  .clientbox .hd { margin: 8px 0 2px; }
  .clientbox .hd .vt { font-weight: 800; color: var(--navy); font-size: 13px; line-height: 1.5; }
  .clientbox .bxBody p:first-child { margin-top: 4px; }
  .clientbox.min { padding-bottom: 8px; }
  .valuebox .hd .vt { margin-bottom: 0; }
  .coreidea .hd .ct { margin-bottom: 1px; }
  .coreidea .bxBody > div { padding-top: 2px; }
  .actstrip { border: 1.5px solid var(--navy); background: #eff3f8; border-radius: 10px; padding: 8px 12px; margin: 9px 0 4px; font-size: 12.5px; line-height: 1.55; }
  .actstrip b { color: var(--navy); }
  .actstrip .tt { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--navy); margin-bottom: 3px; }
  .actstrip .striprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
  .actstrip .striprow .mini { font-size: 12px; padding: 4px 11px; background: #fff; }
  .actstrip .striprow .mini:disabled { opacity: .45; cursor: default; }
  .actstrip .hownote { font-size: 11.5px; color: var(--secondary); }
  .qtag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; margin: 0 6px 0 0; text-transform: uppercase; background: #e7f0fb; color: #1d5fa8; border: 1px solid rgba(29,95,168,.35); vertical-align: middle; }
  details.teach { margin-top: 9px; border: 1.5px dashed rgba(51,71,91,.3); border-radius: 10px; padding: 6px 11px; background: #fafaf7; }
  details.teach summary { cursor: pointer; font-size: 11.5px; font-weight: 800; color: var(--navy); letter-spacing: .03em; }
  details.teach[open] { background: #f4f6f9; padding-bottom: 9px; }
  details.teach p { margin: 7px 0 0; font-size: 12.5px; }
  .pillbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .spill { display: flex; align-items: center; gap: 5px; border: 1.5px solid #dcdbd4; border-radius: 999px; padding: 3px 10px; background: #fafaf7; font-size: 11px; font-weight: 700; color: #52514e; }
  .spill .sdots { display: flex; gap: 4px; }
  .spill .sd { width: 7px; height: 7px; border-radius: 50%; background: #dfe1dc; }
  .spill .sd.past { background: var(--green); } .spill .sd.cur { background: var(--navy); transform: scale(1.3); }
  .spill.active { border-color: var(--navy); background: #eff3f8; color: var(--navy); }
  .spill .sd.jump { cursor: pointer; }
  .spill .sd.jump:hover { transform: scale(1.6); }
  .spill.reach { cursor: pointer; }
  .lbar { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .lbar .lchip { border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; background: #fff; color: var(--secondary); font-family: var(--sans); }
  .lbar .lchip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .lbar .lchip.active.done { background: var(--green); border-color: var(--green); color: #fff; }
  .lbar .lchip.live { background: var(--red); border-color: var(--red); color: #fff; }

  .lp-fb .fbh .fbk { letter-spacing: .03em; }
  .lp-fb .fbmore { float: right; margin: -2px 0 4px 10px; width: 22px; height: 22px; padding: 0; border-radius: 6px; font-size: 16px; line-height: 1; font-weight: 800; background: #fff; border: 1px solid currentColor; color: inherit; cursor: pointer; font-family: var(--sans); display: inline-flex; align-items: center; justify-content: center; }
  .lp-fb .fbrest { display: none; clear: both; margin-top: 6px; }
  .lp-fb .fbrest.open { display: block; }
  .lp-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 800; letter-spacing: .1em; color: var(--navy); background: #eff3f8; border: 1.5px dashed var(--navy); border-radius: 10px; padding: 10px 12px; text-align: center; margin: 10px 0; user-select: all; }
  .delivbox { background: #eef7ee; border: 1px solid #bfe0bf; border-left: 4px solid var(--green); border-radius: 10px; padding: 10px 13px; margin: 10px 0; font-size: 12.5px; line-height: 1.55; }
  .delivbox .vt { font-weight: 800; color: var(--green); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .cpage { position: fixed; top: -12px; pointer-events: none; z-index: 90; font-size: 18px; animation: fallpage linear forwards; }
  @keyframes fallpage { to { transform: translateY(105vh) rotate(340deg); opacity: .9; } }
  .frac { display: inline-block; text-align: center; vertical-align: middle; margin: 0 3px; font-size: 12px; line-height: 1.25; }
  .frac .top { display: block; border-bottom: 1.3px solid #1f1e1c; padding: 0 5px 1px; }
  .frac .bot { display: block; padding: 1px 5px 0; }
  /* the register (activity list) in the lesson card */
  .regwrap { max-height: 320px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; background: #fff; }
  table.reg { width: 100%; border-collapse: collapse; font-size: 11.2px; font-variant-numeric: tabular-nums; }
  table.reg th { position: sticky; top: 0; background: #eef0f5; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); padding: 5px 6px; text-align: left; border-bottom: 1px solid var(--border); }
  table.reg td { padding: 3.5px 6px; border-bottom: 1px solid #f0efe9; vertical-align: top; line-height: 1.3; }
  table.reg td.id { font-weight: 700; color: var(--secondary); white-space: nowrap; }
  table.reg td.n { text-align: center; }
  table.reg tr.cur td { background: #fff3cc; font-weight: 700; }
  table.reg tr.done td { color: #9a9890; }
  table.reg tr.done td.id { color: var(--green); }
  .regwrap.sched td.n { width: 30px; }
  /* cards under the stage */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 9px 12px 8px; display: none; }
  .tile.show { display: block; }
  .tile .k { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .s { font-size: 11px; color: var(--secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.cE { border-color: var(--red); }   .tile.cE .v { color: var(--red); }
  .tile.cD { border-color: var(--navy); }  .tile.cD .v { color: var(--navy); }
  .tile.cC { border-color: var(--violet); } .tile.cC .v { color: var(--violet); }
  .tile.cM { border-color: var(--green); }  .tile.cM .v { color: var(--green); }
  .tile.born { animation: born .9s ease; }
  .tile.flash { animation: tileflash 1.1s ease-in-out infinite; }
  @keyframes tileflash { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,154,6,0); background: var(--surface); } 50% { box-shadow: 0 0 0 5px rgba(217,154,6,.45); background: #fff3cc; border-color: var(--gold); } }
  /* notebook */
  .nb { position: sticky; top: 12px; }
  .nb-entry { border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 10px; padding: 8px 11px; margin-bottom: 8px; background: #fff; }
  .nb-entry .nm { font-size: 12px; font-weight: 700; color: var(--ink); }
  .nb-entry .fx { font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; color: var(--navy); margin-top: 3px; line-height: 1.45; }
  .nb-entry .df { font-size: 11.5px; color: var(--secondary); line-height: 1.45; margin-top: 2px; }
  .nb-entry.e-w { border-left-color: var(--blue); }
  .nb-entry.e-n { border-left-color: var(--navy); }
  .nb-entry.e-f { border-left-color: var(--green); }
  .nb-entry.e-b { border-left-color: var(--violet); }
  .nb-entry.e-s { border-left-color: var(--gold); }
  .nb-entry.e-c { border-left-color: var(--red); }
  .nb-entry.e-g { border-left-color: var(--aqua); }
  .nb-entry.e-x { border-left-color: var(--orange); }
  .nb-empty { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  /* ---------- the stage: shared ---------- */
  .stagewrap { position: relative; }
  #stageHost.sticky { position: sticky; top: 8px; max-height: calc(100vh - 16px); overflow-y: auto; padding-bottom: 4px; }
  @media (max-width: 1150px) { #stageHost.sticky { position: static; max-height: none; overflow: visible; } }
  .stagebar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 0 0 8px; }
  .stagebar .cap { font-size: 12px; color: var(--secondary); font-weight: 600; }
  .stagebar .sp { margin-left: auto; }
  .stagebtn { font-size: 12.5px; padding: 6px 11px; border-radius: 8px; background: #fff; font-weight: 700; color: var(--navy); }
  .stagebtn.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .stagenote { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0; line-height: 1.45; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--secondary); margin: 6px 2px 0; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; border: 1.5px solid; }
  /* ---------- the WBS tree ---------- */
  .tray { border: 1.5px dashed rgba(51,71,91,.35); border-radius: 12px; padding: 8px 10px 6px; background: #fafaf7; margin-bottom: 12px; min-height: 52px; position: sticky; top: 4px; z-index: 6; }   /* the cards stay in reach while a tall tree scrolls beneath them */
  .tray .k { font-size: 10.5px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .tray .k span { font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--muted); }
  .traycards { display: flex; flex-wrap: wrap; gap: 6px; }
  .traymsg { font-size: 12px; line-height: 1.45; margin-top: 5px; color: var(--secondary); min-height: 35px; }   /* two lines are always reserved, so a message does not shift the tree under a drag */
  .traymsg .warn { color: var(--red); font-weight: 700; }
  .wcard { border: 1.5px solid var(--navy); background: #fff; border-radius: 8px; padding: 4px 9px; font-size: 11.5px; font-weight: 700; color: var(--ink); line-height: 1.3; cursor: grab; user-select: none; touch-action: none; max-width: 100%; }
  .wcard:hover { box-shadow: 0 2px 8px rgba(30,40,50,.18); }
  .wcard:focus-visible, .slot.live:focus-visible { outline: 2.5px solid var(--navy); outline-offset: 2px; }
  .wcard.sel { outline: 2.5px solid var(--gold); outline-offset: 1px; background: #fff8e1; }
  .wcard.ghost { opacity: .35; }
  .wcard.drag { position: fixed; z-index: 200; pointer-events: none; box-shadow: 0 8px 22px rgba(30,40,50,.3); transform: rotate(-1.5deg); cursor: grabbing; }
  .wcard.shake { animation: shake .35s ease; border-color: var(--red); }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  .wbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .wcol .dhead { border-radius: 10px; padding: 7px 9px; color: #fff; font-size: 12px; font-weight: 800; line-height: 1.3; }
  .wcol .dhead .tt { display: block; font-size: 9px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; font-weight: 700; margin-top: 2px; }
  .wcol[data-b="1"] .dhead { background: var(--b1); } .wcol[data-b="2"] .dhead { background: var(--b2); } .wcol[data-b="3"] .dhead { background: var(--b3); } .wcol[data-b="4"] .dhead { background: var(--b4); }
  .wkids { margin-left: 8px; border-left: 2px solid #d5d8dc; padding-left: 7px; margin-top: 6px; }
  .wcol[data-b="1"] .wkids { border-left-color: #b9d3f2; } .wcol[data-b="2"] .wkids { border-left-color: #b8dcb9; } .wcol[data-b="3"] .wkids { border-left-color: #f2cdb3; } .wcol[data-b="4"] .wkids { border-left-color: #d2c6f0; }
  .slot { border: 1.5px dashed #c7cbd0; border-radius: 8px; padding: 4px 8px; font-size: 11px; line-height: 1.3; margin: 5px 0; min-height: 26px; color: #9a9890; background: rgba(255,255,255,.5); transition: background .15s, border-color .15s; position: relative; }
  .slot .tt { font-size: 8.5px; letter-spacing: .05em; text-transform: uppercase; font-weight: 800; white-space: nowrap; }
  .slot.live { border-color: var(--navy); color: var(--navy); background: #fff; cursor: pointer; }
  .slot.live.over { background: #e3f0e3; border-color: var(--green); border-style: solid; }
  .slot.live.hint { background: #f2f8f2; }
  .slot.bad { animation: btnpulseRed .8s ease 2; border-color: var(--red); background: #fdf1f1; }

  /* ================= the crash panel (the live session) ================= */
  const CR = { cut: {}, log: [], lock: true, best: null, msg: '' };
  const CRASH_IDS = ['2.1.1', '2.1.2', '2.2.1.1', '3.1.1', '3.1.2', '3.2.1', '3.2.2', '4.1.1.1', '4.1.1.2', '4.1.2.1', '4.2.1.1', '1.1.1.1'];
  function crashOver() { const o = {}; Object.keys(CR.cut).forEach(id => { if (CR.cut[id]) o[id] = A[id].dur - CR.cut[id]; }); return o; }
  function crashCost() { return Object.keys(CR.cut).reduce((s, id) => s + (CR.cut[id] || 0) * CRASH[id].slope, 0); }
  function canCut(id) { return CRASH[id] && (A[id].dur - (CR.cut[id] || 0)) > CRASH[id].ct && !(CR.lock && SAFETY.includes(id)); }
  function eventDayWith(cuts) { const o = {}; Object.keys(cuts).forEach(id => { if (cuts[id]) o[id] = A[id].dur - cuts[id]; }); return cpm(o).eventDay; }
  // the cheapest way to bring Event Day forward by one day from the current state: one activity, or two in parallel

  function applyCrash() {

    let h = '<div class="k"><span>Crashing · shorten an activity by one day at its cost per day</span><span><button type="button" class="mini" id="crBest">Cheapest option</button> <button type="button" class="mini" id="crReset">Reset</button></span></div>';
    h += '<div class="levrow"><button type="button" class="lev' + (CR.lock ? ' on' : '') + '" id="crLock" role="switch" aria-checked="' + (CR.lock ? 'true' : 'false') + '"><span class="sw"><span class="knob"></span></span><span class="ln">Safety-critical activities locked</span><span class="lc">Prepare venue &amp; equipment — stage rigging and electrical work keep their two days</span></button></div>';

      h += '<tr class="' + (crit ? 'crit' : '') + (locked ? ' locked' : '') + (best ? ' best' : '') + '"><td class="nm">' + a.id + ' ' + esc(a.name) + (locked ? '<span class="lk">SAFETY</span>' : '') + '</td><td>' + a.dur + '</td><td class="now' + (cut ? ' chg' : '') + '">' + now + '</td><td>' + c.ct + '</td><td>' + money(c.slope) + '</td><td><button type="button" class="cb crMinus" data-id="' + id + '" title="Crash by one day" ' + (canCut(id) ? '' : 'disabled') + '>−</button><button type="button" class="cb crPlus" data-id="' + id + '" title="Undo one day" ' + (cut ? '' : 'disabled') + '>+</button></td></tr>';

    h += '<div class="crashlog"><table><tr><th>Step</th><th>Crash decision</th><th>Event Day</th><th>Cost</th><th>Cumulative</th></tr><tr><td>0</td><td>— (the plan)</td><td>day ' + BASE.eventDay + '</td><td>—</td><td>$0</td></tr>';
    let cum = 0; CR.log.forEach((l, i) => { cum += l.cost; h += '<tr' + (MONEY.revenue - MONEY.costs - cum < MONEY.floor ? ' class="over"' : '') + '><td>' + (i + 1) + '</td><td>Crash ' + esc(A[l.id].name) + ' by 1 day' + (l.gained ? '' : ' (no gain — another path is critical)') + '</td><td>day ' + l.day + '</td><td>' + money(l.cost) + '</td><td>' + money(cum) + '</td></tr>'; });
