<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Business Process Lab · Exercise 4 — Levers</title>
<style>
  :root {
    --page: #f5f5f2; --surface: #fcfcfb; --ink: #16212b; --navy: #33475b;
    --secondary: #52514e; --muted: #898781; --grid: #e1e0d9; --border: rgba(11,11,11,0.10);
    --red: #a5202f; --green: #2e7d32; --amber: #b5850b; --gold: #d99a06;
    --blue: #2a78d6; --orange: #eb6834; --aqua: #1baf7a; --violet: #7c5cd6;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --radius: 14px; --shadow: 0 2px 10px rgba(30,40,50,.07);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); background: var(--page); color: var(--ink); }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 22px 10px; gap: 14px; flex-wrap: wrap; }
  .header h1 { margin: 0; font-size: 21px; font-weight: 800; color: var(--navy); }
  .ver { font-size: 11px; color: var(--muted); font-weight: 700; }
  .hdr-right { display: flex; align-items: center; gap: 12px; }
  .score { font-size: 13px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .prog { width: 180px; height: 8px; background: #e8eae5; border-radius: 5px; overflow: hidden; }
  .progrow { display: flex; align-items: center; gap: 10px; margin: 0 0 8px 2px; }
  .progrow .prog { flex: 1; width: auto; }
  .prog > div { height: 100%; background: var(--green); border-radius: 5px; transition: width .5s; }
  select.small { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-family: var(--sans); font-size: 12px; font-weight: 600; background: #fff; color: var(--ink); }
  .app { display: grid; grid-template-columns: 380px minmax(0,1fr) 250px; gap: 14px; padding: 0 16px 20px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
  .card h2 { margin: 0 0 8px; font-size: 12.5px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .07em; }
  .lp-step { font-size: 13.5px; line-height: 1.65; color: var(--ink); }
  .lp-step p { margin: 8px 0; }
  .lp-step b { color: var(--navy); }
  .lp-opt { display: block; width: 100%; text-align: left; margin: 6px 0; padding: 10px 12px; background: #fff; border: 1px solid var(--border); border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.45; cursor: pointer; font-family: var(--sans); }
  .lp-opt:hover { border-color: var(--navy); }
  .lp-opt.ok { border-color: var(--green); background: #f2f8f2; box-shadow: inset 0 0 0 1.4px var(--green); }
  .lp-opt.bad { border-color: var(--red); background: #fdf1f1; }
  .lp-fb { font-size: 12.5px; line-height: 1.55; margin-top: 8px; padding: 9px 12px; border-radius: 10px; display: none; }
  .lp-fb.ok { display: block; background: #f2f8f2; color: #1d5a20; border: 1px solid rgba(46,125,50,.3); }
  .lp-fb.bad { display: block; background: #fdf1f1; color: var(--red); border: 1px solid rgba(165,32,47,.3); }
  .lp-fb.info { display: block; background: #eff3f8; color: var(--navy); border: 1px solid rgba(51,71,91,.25); }
  .lp-status { font-size: 12.5px; color: var(--secondary); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .lp-status.pass { color: var(--green); font-weight: 800; }
  .lp-nav { display: flex; gap: 8px; margin-top: 14px; }
  .lp-nav button { flex: 1; }
  button { appearance: none; border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-family: var(--sans); font-size: 14px; font-weight: 700; cursor: pointer; background: #eef0ee; color: var(--ink); }
  button:hover { filter: brightness(.97); }
  button:disabled { opacity: .45; cursor: default; }
  .primary { background: var(--navy); color: #fff; border-color: var(--navy); }
  .primary:disabled { background: #b9c0c7; border-color: #b9c0c7; opacity: 1; }
  .mini { font-size: 12.5px; padding: 6px 11px; border-radius: 8px; background: #fff; font-weight: 700; color: var(--navy); }
  .lp-num { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  .lp-num input { flex: 1 1 90px; min-width: 0; width: 90px; border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px; font-size: 14px; font-family: var(--sans); font-variant-numeric: tabular-nums; }
  /* stage */
  .stagewrap { position: relative; }
  #stageSvg { width: 100%; height: auto; display: block; }
  #stageCanvas { position: absolute; pointer-events: none; }
  .runbar { display: none; gap: 8px; align-items: center; margin-top: 6px; position: relative; flex-wrap: wrap; }
  .runbar.show { display: flex; }
  .runbar .clock { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
  .endin { width: 60px; border: 1.2px solid var(--border); border-radius: 8px; padding: 3px 6px; font: inherit; font-size: 12px; background: #fff; }
  .spd { min-width: 40px; }
  .spd.act { background: var(--navy); color: #fff; border-color: var(--navy); }
  #playBtn.pulse, #resetBtn.pulse { animation: btnpulse 1.15s ease-in-out infinite; border-color: var(--green); color: var(--green); }
  @keyframes btnpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(46,125,50,.55); } 55% { box-shadow: 0 0 0 7px rgba(46,125,50,0); } }
  /* lever panel */
  .levers { display: none; margin-top: 10px; background: var(--surface); border: 1.5px solid var(--navy); border-radius: 12px; padding: 9px 12px; }
  .levers.show { display: block; }
  .levers .k { font-size: 10.5px; font-weight: 800; color: var(--navy); text-transform: uppercase; letter-spacing: .06em; }
  .levrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 7px; }
  .lev { flex: 1 1 180px; border: 1.5px solid var(--border); border-radius: 10px; background: #fff; padding: 7px 10px; text-align: left; font-size: 12.5px; line-height: 1.4; }
  .lev .ln { font-weight: 800; color: var(--navy); display: block; }
  .lev .lc { color: var(--secondary); font-weight: 600; font-size: 11.5px; }
  .lev { cursor: pointer; padding-left: 54px; position: relative; }
  .lev .sw { position: absolute; left: 10px; top: 10px; width: 34px; height: 19px; border-radius: 99px; background: #cfd3d8; transition: background .18s; }
  .lev .sw .knob { position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: left .18s; }
  .lev.on { border-color: var(--green); background: #f2f8f2; }
  .lev.on .sw { background: var(--green); }
  .lev.on .sw .knob { left: 17px; }
  .lev:disabled { opacity: .45; cursor: default; }
  .lev.pulse { animation: btnpulse 1.15s ease-in-out infinite; border-color: var(--green); }
  .lev.pulse-red { animation: btnpulseRed 1s ease-in-out infinite; border-color: var(--red); background: #fdf1f1; }
  /* a quantity lever: a stepper instead of a switch */
  .lev.stepper { cursor: default; padding-left: 104px; }
  .lev.stepper.dis { opacity: .45; }
  .lev.stepper .stp { position: absolute; left: 10px; top: 8px; display: flex; align-items: center; gap: 3px; }
  .lev.stepper .stb { width: 25px; height: 25px; padding: 0; border-radius: 7px; font-size: 16px; line-height: 1; background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .lev.stepper .stb:disabled { opacity: .35; }
  .lev.stepper .stn { min-width: 26px; text-align: center; font-size: 17px; font-weight: 800; color: var(--navy); font-variant-numeric: tabular-nums; }
  .lev.stepper.on .stn { color: var(--green); }
  .chartcard { margin-top: 10px; padding: 9px 12px 6px; border-color: rgba(124,92,214,.45); position: relative; }
  .chartcard canvas { width: 100%; height: 250px; display: block; }
  .chartcard .k { padding-right: 130px; }
  details.chartwhy { position: absolute; top: 8px; right: 10px; z-index: 2; margin: 0; max-width: 360px; padding: 4px 10px; background: #fafaf7; }
  details.chartwhy[open] { padding-bottom: 8px; box-shadow: var(--shadow); }
  details.chartwhy p { margin: 6px 0 0; font-size: 12px; line-height: 1.5; }
  details.chartwhy p b { color: inherit; }
  @keyframes btnpulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(165,32,47,.6); } 55% { box-shadow: 0 0 0 7px rgba(165,32,47,0); } }
  .swchip { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em; padding: 1px 7px; border-radius: 6px; vertical-align: 1px; margin: 0 1px; }
  .swchip.on { background: var(--green); color: #fff; border: 1px solid var(--green); }
  .swchip.off { background: #fff; color: #6b6960; border: 1px solid #b7b5ac; }
  .pulse-btn { animation: btnpulse 1.15s ease-in-out infinite; border-color: var(--green) !important; color: var(--green) !important; }
  .tile.flash { animation: tileflash 1.1s ease-in-out infinite; }
  @keyframes tileflash { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,154,6,0); background: var(--surface); } 50% { box-shadow: 0 0 0 5px rgba(217,154,6,.45); background: #fff3cc; border-color: var(--gold); } }
  .coreidea { border: 1.5px solid rgba(181,133,11,.5); background: #fbf5e3; border-radius: 10px; padding: 9px 12px; margin: 9px 0 6px; font-size: 12.5px; line-height: 1.55; }
  .coreidea .ct { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--amber); margin-bottom: 3px; }
  .lp-num.two { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
  .lp-num.two .fld { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .lp-num.two .fl { font-size: 11.5px; font-weight: 700; color: var(--navy); line-height: 1.3; }
  .lp-num.two input { width: 100%; min-width: 0; }
  .lp-num input.off { border-color: var(--red); background: #fdf1f1; }
  .delivwrap { position: relative; }
  .confetti { position: absolute; inset: -14px -6px -10px; pointer-events: none; overflow: hidden; z-index: 0; }
  .confetti i { position: absolute; top: -10px; width: 7px; height: 11px; border-radius: 2px; opacity: 0; animation-name: confettifall; animation-timing-function: ease-in; animation-iteration-count: 2; }
  @keyframes confettifall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(150px) rotate(540deg); opacity: 0; } }
  .delivwrap .delivbox { position: relative; z-index: 1; }
  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { background: var(--surface); border: 1.5px solid var(--border); border-radius: 12px; padding: 9px 12px 8px; display: none; }
  .tile.show { display: block; }
  .tile .k { font-size: 10.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .tile .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .tile .s { font-size: 11px; color: var(--secondary); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile.cR { border-color: var(--blue); }   .tile.cR .v { color: var(--blue); }
  .tile.cT { border-color: var(--violet) }  .tile.cT .v { color: var(--violet); }
  .tile.cI { border-color: var(--aqua) }    .tile.cI .v { color: var(--aqua); }
  .tile.cP { border-color: var(--green) }   .tile.cP .v { color: var(--green); }
  @keyframes born { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  .tile.born { animation: born .9s ease; }
  /* notebook */
  .nb { position: sticky; top: 12px; }
  .nb-entry { border: 1px solid var(--border); border-left: 4px solid var(--navy); border-radius: 10px; padding: 8px 11px; margin-bottom: 8px; background: #fff; }
  .nb-entry .nm { font-size: 12px; font-weight: 700; color: var(--ink); }
  .nb-entry .fx { font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; color: var(--navy); margin-top: 3px; }
  .nb-entry .df { font-size: 11.5px; color: var(--secondary); line-height: 1.45; margin-top: 2px; }
  .nb-entry.e-c { border-left-color: var(--green); }
  .nb-entry.e-R { border-left-color: var(--blue); }
  .nb-entry.e-u { border-left-color: var(--gold); }
  .nb-entry.e-b { border-left-color: var(--red); }
  .nb-entry.e-I { border-left-color: var(--aqua); }
  @keyframes flashIn { 0%, 100% { opacity: 1; } 50% { opacity: .12; } }
  .flashIn { animation: flashIn .65s ease 5; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .lp-fb.bad { animation: shake .35s ease; }
  .ntR, .ntT, .ntI { text-transform: none; font-style: italic; }
  @media (max-width: 1150px) { .app { grid-template-columns: 1fr; } .nb { position: static; } .tiles { grid-template-columns: repeat(2,1fr); } }
  details.teach { margin-top: 9px; border: 1.5px dashed rgba(51,71,91,.3); border-radius: 10px; padding: 6px 11px; background: #fafaf7; }
  details.teach summary { cursor: pointer; font-size: 11.5px; font-weight: 800; color: var(--navy); letter-spacing: .03em; }
  details.teach[open] { background: #f4f6f9; padding-bottom: 9px; }
  details.teach p { margin: 7px 0 0; font-size: 12.5px; }
  .pillbar { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
  .spill { display: flex; align-items: center; gap: 5px; border: 1.5px solid #dcdbd4; border-radius: 999px; padding: 3px 10px; background: #fafaf7; font-size: 11px; font-weight: 700; color: #52514e; }
  .spill .sdots { display: flex; gap: 4px; }
  .spill .sd { width: 7px; height: 7px; border-radius: 50%; background: #dfe1dc; }
  .spill .sd.past { background: var(--green); } .spill .sd.cur { background: var(--navy); transform: scale(1.3); }
  .spill.active { border-color: var(--navy); background: #eff3f8; color: var(--navy); }
  .frac { display: inline-block; text-align: center; vertical-align: middle; margin: 0 3px; font-size: 12px; line-height: 1.25; }
  .frac .top { display: block; border-bottom: 1.3px solid #1f1e1c; padding: 0 5px 1px; }
  .frac .bot { display: block; padding: 1px 5px 0; }
  .actstrip { border: 1.5px solid var(--navy); background: #eff3f8; border-radius: 10px; padding: 8px 12px; margin: 9px 0 4px; font-size: 12.5px; line-height: 1.55; }
  .actstrip b { color: var(--navy); }
  .actstrip .tt { display: block; font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--navy); margin-bottom: 3px; }
  .qtag { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; margin: 0 6px 0 0; text-transform: uppercase; background: #e7f0fb; color: #1d5fa8; border: 1px solid rgba(29,95,168,.35); vertical-align: middle; }
  .contnote { font-size: 12px; color: #898781; font-weight: 700; margin: 10px 0 0; }
  .valuebox { background: #fdf6e0; border: 1px solid #e5d391; border-left: 4px solid #8a6d1f; border-radius: 10px; padding: 10px 13px; margin: 10px 0; font-size: 12.5px; line-height: 1.55; }
  .valuebox .vt { font-weight: 800; color: #8a6d1f; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  .valuebox .hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .valuebox .hd .vt { margin-bottom: 0; }
  .valuebox .hd .mini { font-size: 11px; padding: 3px 8px; }
  .hintrow { display: flex; gap: 6px; margin-top: 6px; }
  .hintrow .mini { font-size: 11.5px; padding: 4px 9px; }
  .valuebox .src { font-size: 10.5px; color: #9a8a52; margin-top: 5px; }
  .clientbox { background: #eef3fa; border: 1px solid #c9d8ea; border-left: 4px solid var(--blue); border-radius: 10px; padding: 4px 13px; margin: 6px 0 10px; font-size: 13px; line-height: 1.6; }
  .clientbox p { margin: 8px 0; }
  details.plantbl { margin: 8px 0 4px; border: 1.5px dashed rgba(51,71,91,.3); border-radius: 10px; padding: 6px 11px; background: #fafaf7; }
  details.plantbl summary { cursor: pointer; font-size: 11.5px; font-weight: 800; color: var(--navy); letter-spacing: .03em; }
  .delivbox { background: #eef7ee; border: 1px solid #bfe0bf; border-left: 4px solid var(--green); border-radius: 10px; padding: 10px 13px; margin: 10px 0; font-size: 12.5px; line-height: 1.55; }
  .delivbox .vt { font-weight: 800; color: var(--green); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; display: block; margin-bottom: 3px; }
  table.plan { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; font-variant-numeric: tabular-nums; table-layout: fixed; }
  table.plan th, table.plan td { border: 1px solid var(--border); padding: 5px 6px; text-align: right; vertical-align: top; }
  table.plan th:nth-child(2), table.plan td:nth-child(2) { width: 74px; }
  table.plan th:nth-child(3), table.plan td:nth-child(3) { width: 82px; }
  table.plan .pn { font-weight: 700; color: var(--ink); line-height: 1.3; }
  table.plan .ps { font-size: 10.5px; color: var(--muted); font-weight: 600; margin-top: 2px; line-height: 1.3; }
  .plannote { font-size: 11px; color: var(--secondary); margin: -2px 0 6px; }
  table.plan th { background: #eef0f5; font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--navy); }
  table.plan td:first-child, table.plan th:first-child { text-align: left; }
  table.plan tr.best td { background: #f2f8f2; font-weight: 700; }
  /* minimizable intro boxes (the client, what this is worth, the core idea) */
  .mbox .hd { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .mbox .hd .mini { font-size: 11px; padding: 3px 8px; flex: none; }
  .bxBody { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .3s ease; }
  .bxBody > div { overflow: hidden; min-height: 0; }
  .mbox.min .bxBody { grid-template-rows: 0fr; }
  .clientbox .hd { margin: 8px 0 2px; }
  .clientbox .hd .vt { font-weight: 800; color: var(--navy); font-size: 13px; line-height: 1.5; }
  .clientbox .bxBody p:first-child { margin-top: 4px; }
  .clientbox.min { padding-bottom: 8px; }
  .coreidea .hd .ct { margin-bottom: 1px; }
  .coreidea .bxBody > div { padding-top: 2px; }
  /* feedback boxes: a bold head and the first sentence; the rest behind a + */
  .lp-fb .fbh .fbk { letter-spacing: .03em; }
  .lp-fb .fbmore { float: right; margin: -2px 0 4px 10px; width: 22px; height: 22px; padding: 0; border-radius: 6px; font-size: 16px; line-height: 1; font-weight: 800; background: #fff; border: 1px solid currentColor; color: inherit; cursor: pointer; font-family: var(--sans); }
  .lp-fb .fbrest { display: none; clear: both; margin-top: 6px; }
  .lp-fb .fbrest.open { display: block; }
  .lp-fb .fbmore { display: inline-flex; align-items: center; justify-content: center; }
  /* the answer label inline with the box */
  .lp-num .asklbl { align-self: center; color: var(--navy); font-size: 13px; white-space: nowrap; }
  .spill .sd.jump { cursor: pointer; }
  .spill .sd.jump:hover { transform: scale(1.6); }
  .spill.reach { cursor: pointer; }
  .lbar { display: flex; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .lbar .lchip { border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 12.5px; font-weight: 700; background: #fff; color: var(--secondary); font-family: var(--sans); }
  .lbar .lchip.active { background: var(--navy); color: #fff; border-color: var(--navy); }
  .lbar .lchip.active.done { background: var(--green); border-color: var(--green); color: #fff; }
  .lp-take { background: #fdf8ec; border: 1.5px solid rgba(181,133,11,.45); border-radius: 12px; padding: 13px 15px; margin: 10px 0; font-size: 14px; font-weight: 700; color: #6b5106; line-height: 1.6; }
  .lp-take .tt { font-size: 11px; letter-spacing: .08em; color: var(--amber); display: block; margin-bottom: 4px; }
  .lp-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 17px; font-weight: 800; letter-spacing: .1em; color: var(--navy); background: #eff3f8; border: 1.5px dashed var(--navy); border-radius: 10px; padding: 10px 12px; text-align: center; margin: 10px 0; user-select: all; }
  .cpage { position: fixed; top: -12px; pointer-events: none; z-index: 90; font-size: 18px; animation: fallpage linear forwards; }
  @keyframes fallpage { to { transform: translateY(105vh) rotate(340deg); opacity: .9; } }
  /* the calculator: a round button at the bottom right; the panel opens above it */
  .calcbtn { position: fixed; right: 18px; bottom: 18px; width: 48px; height: 48px; border-radius: 50%; background: var(--navy); color: #fff; border: 2px solid #fff; box-shadow: 0 3px 12px rgba(30,40,50,.28); display: flex; align-items: center; justify-content: center; padding: 0; z-index: 96; cursor: pointer; }
  .calcbtn:hover { filter: brightness(1.1); }
